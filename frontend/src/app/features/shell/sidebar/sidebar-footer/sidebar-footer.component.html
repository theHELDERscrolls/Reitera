<div class="relative border-t min-h-16.5 border-border shrink-0" data-profile-menu>
  @if (isProfileOpen()) {
    <app-profile-panel (navigated)="isProfileOpen.set(false); navigated.emit()" />
  }

  <button
    (click)="toggleProfile()"
    class="flex items-center justify-start w-full min-h-16.5 p-3 transition-colors hover:bg-overlay"
    [class]="isCollapsed() ? 'justify-center' : 'gap-3'"
    [attr.aria-label]="'shell.profile.open' | transloco"
  >
    <div
      class="flex items-center justify-center text-xs font-semibold uppercase border rounded-full size-8 bg-overlay border-border shrink-0 text-foreground"
    >
      {{ (currentUser()?.username ?? '?').charAt(0) }}
    </div>
    @if (!isCollapsed()) {
      <div class="flex flex-col items-start justify-center gap-0.5 min-w-0">
        <span class="font-semibold text-md text-foreground">{{
          currentUser()?.username ?? '—'
        }}</span>
        <span class="text-xs text-muted">{{
          currentUser()?.email ?? ''
        }}</span>
      </div>
    }
  </button>
</div>
