<div class="relative shrink-0 p-2" data-profile-menu>
  @if (isProfileOpen()) {
    <app-profile-panel (navigated)="isProfileOpen.set(false); navigated.emit()" />
  }

  <button
    (click)="toggleProfile()"
    class="flex items-center w-full rounded-xs p-2.5 transition-colors hover:bg-overlay"
    [class]="isCollapsed() ? 'justify-center' : 'justify-start gap-3'"
    [attr.aria-label]="'shell.profile.open' | transloco"
  >
    <app-avatar
      [src]="currentUser()?.avatarId ? 'avatars/' + currentUser()!.avatarId + '.svg' : null"
      [name]="currentUser()?.username ?? ''"
      size="sm"
    />
    <div
      class="flex flex-col items-start justify-center gap-0.5 min-w-0 transition-all duration-200 overflow-hidden"
      [class]="isCollapsed() ? 'opacity-0 max-w-0' : 'opacity-100 max-w-full'"
    >
      <span class="text-sm font-semibold text-foreground truncate">{{ currentUser()?.username ?? '—' }}</span>
      <span class="text-xs text-muted-foreground truncate">{{ currentUser()?.email ?? '' }}</span>
    </div>
  </button>
</div>
