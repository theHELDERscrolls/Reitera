  <button
    (click)="toggle.emit()"
    class="flex items-center min-w-0 gap-2 rounded-md hover:opacity-80 transition-opacity"
    [attr.aria-label]="'shell.sidebar.collapse' | transloco"

    <svg lucideLibraryBig class="rounded-md p-0.5 size-7 bg-primary shrink-0 text-background" />

    }
