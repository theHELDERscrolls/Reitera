<div class="flex flex-col gap-8">
  <app-page-header
    [title]="'dashboard.title' | transloco"
    [subtitle]="'dashboard.welcome' | transloco: { name: firstName() }"
  />

  <!-- Stat badges -->
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
    @if (statsLoading()) {
      @for (_ of [0, 1, 2]; track $index) {
        <div class="h-18 animate-pulse rounded-md bg-overlay"></div>
      }
    } @else if (statsError()) {
      <div
        class="flex items-center col-span-3 gap-3 p-4 text-sm border-2 rounded-md bg-surface border-border text-muted-foreground"
      >
        <span>{{ 'dashboard.error' | transloco }}</span>
      </div>
    } @else {
      <app-stat-card
        [value]="stats()!.totalDueToday"
        [label]="'dashboard.stats.dueToday' | transloco"
        color="accent-2"
      >
        <svg icon lucideCalendarCheck class="size-20" />
      </app-stat-card>

      <app-stat-card
        [value]="stats()!.studiedToday"
        [label]="'dashboard.stats.studiedToday' | transloco"
        color="accent-4"
      >
        <svg icon lucideBookOpen class="size-20" />
      </app-stat-card>

      <app-stat-card
        [value]="stats()!.streak"
        [label]="'dashboard.stats.streak' | transloco"
        color="accent-3"
      >
        <svg icon lucideFlame class="size-20" />
      </app-stat-card>
    }
  </div>

  <!-- Activity heatmap -->
  <section class="rounded-md border-2 border-border bg-surface p-4 shadow-[3px_3px_0_var(--ctp-mocha-crust)]">
    <h2 class="mb-3 text-sm font-semibold text-muted-foreground">
      {{ 'dashboard.heatmap.title' | transloco }}
    </h2>
    @if (heatmapLoading()) {
      <div class="h-40 animate-pulse rounded-md bg-overlay"></div>
    } @else if (heatmap()) {
      <app-study-heatmap [data]="heatmap()!" />
    }
  </section>

  <!-- Last studied decks -->
  <app-last-studied-decks
    [decks]="lastStudied() ?? []"
    [loading]="lastStudiedLoading()"
  />
</div>
