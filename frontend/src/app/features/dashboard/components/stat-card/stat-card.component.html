<div
  class="relative overflow-hidden rounded-md border-2 border-primary-foreground/50 p-4 shadow-[3px_3px_0_var(--ctp-mocha-crust)]"
  [class]="bgClass()"
>
  <div class="absolute pointer-events-none opacity-20 -right-3 -top-2 text-primary-foreground" aria-hidden="true">
    <ng-content select="[icon]" />
  </div>
  <div class="relative flex flex-col gap-1">
    <span class="text-3xl font-black leading-none text-primary-foreground">{{ value() }}</span>
    <span class="text-xs font-semibold tracking-wide uppercase text-primary-foreground/70">{{
      label()
    }}</span>
  </div>
</div>
