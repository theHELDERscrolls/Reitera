<div class="flex flex-col gap-4 p-5 border rounded-xs bg-warning/5 border-warning/30">
  <div class="flex items-start gap-3">
    <svg lucideHistory class="mt-0.5 text-warning shrink-0 size-5" />
    <div class="flex flex-col gap-1">
      <p class="text-sm font-semibold text-foreground">{{ title() }}</p>
      <p class="text-sm text-muted">{{ description() }}</p>
    </div>
  </div>

  <div class="flex gap-2">
    <button
      (click)="discarded.emit()"
      class="flex-1 px-4 py-2 text-sm font-medium transition-all rounded-xs bg-overlay text-foreground hover:bg-overlay/70"
    >
      {{ discardLabel() }}
    </button>
    <button
      (click)="resumed.emit()"
      class="flex-1 px-4 py-2 text-sm font-medium transition-all rounded-xs bg-primary text-background hover:bg-primary/90"
    >
      {{ resumeLabel() }}
    </button>
  </div>
</div>
