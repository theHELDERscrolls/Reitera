<div
  [routerLink]="['/decks', deck().id]"
  class="relative flex flex-col gap-3 p-3 min-h-43.75 overflow-hidden transition-all duration-300 ease-in-out border rounded-lg bg-surface/75 border-border group hover:border-border-strong hover:bg-surface cursor-pointer"
>
  <div
    class="absolute top-0 left-0 w-1 h-full transition-all duration-300 ease-in-out rounded-l-lg opacity-50 group-hover:opacity-100"
    [style.background-color]="accentColor()"
  ></div>

  <div class="flex flex-col gap-3 pl-3">
    <!-- Header -->
    <div class="flex items-start justify-between gap-2">
      <div class="flex flex-col items-start justify-between w-full gap-2">
        <h3 class="font-semibold line-clamp-1 text-foreground">{{ deck().title }}</h3>
      </div>

      <!-- Contextual menu -->
      <button
        class="absolute top-1 right-1"
        data-deck-menu
        (click)="$event.stopPropagation()"
        (keydown)="$event.stopPropagation()"
      >
        <button
          (click)="toggleMenu()"
          class="p-1 transition-all rounded-md text-muted hover:text-foreground hover:bg-overlay"
          [attr.aria-label]="'decks.card.options' | transloco"
        >
          <svg lucideEllipsisVertical class="size-4" />
        </button>

        @if (isMenuOpen()) {
          <div
            class="absolute right-0 z-10 overflow-hidden border rounded-lg shadow-lg top-7 min-w-36 bg-surface border-border"
          >
            <button
              (click)="edit.emit(deck()); isMenuOpen.set(false)"
              class="flex items-center w-full gap-2 px-3 py-2 text-sm transition-all text-muted hover:text-foreground hover:bg-overlay"
            >
              <svg lucideSquarePen class="size-4 shrink-0" />
              {{ 'decks.card.edit' | transloco }}
            </button>
            <button
              (click)="delete.emit(deck()); isMenuOpen.set(false)"
              class="flex items-center w-full gap-2 px-3 py-2 text-sm transition-all text-error hover:bg-error/10"
            >
              <svg lucideTrash2 class="size-4 shrink-0" />
              {{ 'decks.card.delete' | transloco }}
            </button>
          </div>
        }
      </button>
    </div>

    <!-- Description -->
    <p class="text-sm text-muted line-clamp-2 text-balance min-h-10">
      {{ deck().description ? deck().description : '-' }}
    </p>

    <!-- Footer -->

    <div
      class="flex items-center gap-3 pt-3 mt-auto border-t border-border"
      [class]="deck().categoryName ? 'justify-between' : 'justify-end'"
    >
      @if (deck().categoryName) {
        <span class="text-xs px-2 py-0.5 rounded-full bg-overlay text-muted font-medium truncate">
          {{ deck().categoryName }}
        </span>
      }
      <span class="flex items-center justify-between gap-2 text-xs font-medium truncate text-muted">
        <svg lucideCalendar class="size-3" />
        {{ deck().createdAt | date: 'mediumDate' }}
      </span>
    </div>
  </div>
</div>
