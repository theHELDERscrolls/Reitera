<div
  [routerLink]="['/decks', deck().id]"
  class="relative flex flex-col gap-3 p-3 min-h-44 overflow-hidden rounded-xs border-3 border-border bg-surface cursor-pointer transition-all duration-200 shadow-[3px_3px_0_0_var(--ctp-mocha-crust)] hover:-translate-y-1 hover:shadow-[6px_6px_0_0_var(--ctp-mocha-crust)] hover:border-border-strong active:translate-y-px active:shadow-[2px_2px_0_0_var(--ctp-mocha-crust)]"
>
  <div
    class="absolute top-0 left-0 w-1.5 h-full rounded-l-xs"
    [style.background-color]="accentColor()"
  ></div>

  <div class="flex flex-col h-full gap-3 pl-3">
    <!-- Header -->
    <div class="flex items-start justify-between gap-2">
      <h3 class="font-bold leading-snug line-clamp-2 text-foreground">{{ deck().title }}</h3>

      <!-- Contextual menu -->
      <div class="shrink-0" data-deck-menu>
        <button
          (click)="toggleMenu(); $event.stopPropagation()"
          (keydown)="$event.stopPropagation()"
          class="p-1 transition-colors rounded-xs text-muted-foreground hover:text-foreground hover:bg-overlay"
          [attr.aria-label]="'decks.card.options' | transloco"
        >
          <svg lucideEllipsisVertical class="size-4" />
        </button>

        @if (isMenuOpen()) {
          <div
            class="absolute right-3 z-10 top-9 min-w-36 overflow-hidden border-3 border-border rounded-xs bg-surface shadow-[3px_3px_0_0_var(--ctp-mocha-crust)]"
          >
            <button
              (click)="edit.emit(deck()); isMenuOpen.set(false); $event.stopPropagation()"
              class="flex items-center w-full gap-2 px-3 py-2 text-sm transition-colors text-muted-foreground hover:text-foreground hover:bg-overlay"
            >
              <svg lucideSquarePen class="size-4 shrink-0" />
              {{ 'decks.card.edit' | transloco }}
            </button>
            <button
              (click)="delete.emit(deck()); isMenuOpen.set(false); $event.stopPropagation()"
              class="flex items-center w-full gap-2 px-3 py-2 text-sm transition-colors text-error hover:bg-error/10"
            >
              <svg lucideTrash2 class="size-4 shrink-0" />
              {{ 'decks.card.delete' | transloco }}
            </button>
          </div>
        }
      </div>
    </div>

    <!-- Description -->
    <p class="flex-1 text-sm text-muted-foreground line-clamp-2">
      {{ deck().description || '—' }}
    </p>

    <!-- Card counts -->
    @if (deck().newCount > 0 || deck().dueCount > 0 || deck().relearningCount > 0) {
      <app-card-count-badges
        [newCount]="deck().newCount"
        [dueCount]="deck().dueCount"
        [relearningCount]="deck().relearningCount"
        size="sm"
      />
    }

    <!-- Footer -->
    <div
      class="flex items-center gap-3 pt-2.5 border-t-2 border-border"
      [class]="deck().categoryName ? 'justify-between' : 'justify-end'"
    >
      @if (deck().categoryName) {
        <app-badge variant="default">{{ deck().categoryName }}</app-badge>
      }
      <span
        class="flex items-center gap-1.5 text-xs font-medium text-muted-foreground truncate shrink-0"
      >
        <svg lucideCalendar class="size-3 shrink-0" />
        {{ deck().createdAt | date: 'mediumDate' }}
      </span>
    </div>
  </div>
</div>
