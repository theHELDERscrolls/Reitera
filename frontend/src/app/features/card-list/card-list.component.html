<!-- Card edit form dialog -->
@if (isCardFormOpen() && cardToEdit()) {
  <app-card-form
    [deckId]="cardToEdit()!.deckId"
    [cardToEdit]="cardToEdit()"
    (saved)="onCardSaved($event)"
    (closed)="closeCardForm()"
    (deleted)="requestDeleteCard(cardToEdit()!); closeCardForm()"
  />
}

<!-- Delete confirmation dialog -->
@if (cardToDelete()) {
  <app-confirm-dialog
    [title]="'cardList.deleteCard.title' | transloco"
    [message]="'cardList.deleteCard.message' | transloco"
    (confirmed)="confirmDeleteCard()"
    (cancelled)="cardToDelete.set(null)"
  />
}

<!-- Page content -->
<div class="flex flex-col gap-6">
  <!-- Page header -->
  <div class="flex items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-foreground">{{ 'cardList.title' | transloco }}</h1>
    </div>
  </div>

  <!-- Filter bar -->
  <div class="flex flex-wrap items-center gap-2 px-3 py-1.5 border rounded-xl bg-surface border-border">
    <!-- Filter icon -->
    <svg lucideListFilter class="mr-1 size-4 text-muted shrink-0" />

    <!-- Question search input -->
    <div class="flex-1 min-w-48">
      <input
        type="text"
        [placeholder]="'cardList.filterQuestion' | transloco"
        [ngModel]="filterQuestion()"
        (ngModelChange)="filterQuestion.set($event)"
        (keydown.enter)="applyFilters()"
        class="w-full px-3 py-1.5 text-sm border rounded-lg bg-background border-border text-foreground placeholder:text-muted focus:outline-none focus:border-primary transition-colors"
      />
    </div>

    <!-- Type dropdown -->
    <app-filter-dropdown
      [options]="typeOptions"
      [selected]="filterType()"
      (selectOption)="selectType($event)"
    />

    <!-- State dropdown -->
    <app-filter-dropdown
      [options]="stateOptions"
      [selected]="filterState()"
      (selectOption)="selectState($event)"
    />

    <!-- Clear filters -->
    <button
      type="button"
      (click)="clearFilters()"
      [disabled]="!hasActiveFilters()"
      class="flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium rounded-lg transition-colors text-muted bg-surface-alt enabled:text-error/90 enabled:bg-error/5 enabled:hover:text-error enabled:hover:bg-error/15 disabled:opacity-40 disabled:cursor-not-allowed"
    >
      <svg lucideX class="size-3.5" />
      {{ 'cardList.filterClear' | transloco }}
    </button>
  </div>

  <!-- Cards table -->
  <app-cards-table
    [cards]="cards()"
    [isLoading]="isLoading()"
    [sortDir]="sortDir()"
    [sortField]="sortField()"
    [emptyTitle]="'cardList.empty.title'"
    [emptySubtitle]="'cardList.empty.subtitle'"
    [showAddAction]="false"
    (edit)="openEditCardForm($event)"
    (delete)="requestDeleteCard($event)"
    (sort)="toggleSort($event)"
  />

  <!-- Pagination -->
  @if (totalPages() > 1) {
    <app-pagination
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      (pageChange)="goToPage($event)"
    />
  }
</div>
