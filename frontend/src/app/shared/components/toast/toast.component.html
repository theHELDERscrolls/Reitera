<div
  class="fixed z-50 flex flex-col gap-2 translate-x-1/2 pointer-events-none top-5 sm:bottom-5 sm:right-5 sm:translate-x-0 right-1/2 w-2xs"
>
  @for (toast of toastService.toasts(); track trackById($index, toast)) {
    <div
      class="relative flex items-center justify-between gap-3 px-4 py-3 overflow-hidden text-sm border-2 rounded-md shadow-[3px_3px_0_var(--ctp-mocha-crust)] pointer-events-auto text-primary-foreground"
      [class]="typeClasses(toast.type)"
    >
      <span class="font-semibold">{{ toast.message }}</span>
      <button
        (click)="toastService.dismiss(toast.id)"
        class="mt-0.5 shrink-0 opacity-100 hover:opacity-70 transition"
        aria-label="Dismiss"
      >
        <svg lucideX class="size-4 stroke-4" />
      </button>

      <div class="absolute bottom-0 left-0 h-0.5 bg-black/50 animate-shrink"></div>
    </div>
  }
</div>
