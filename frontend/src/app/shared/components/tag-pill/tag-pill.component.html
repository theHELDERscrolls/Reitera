<span
  class="flex items-center gap-1 text-xs px-2 py-0.5 rounded-full border font-medium"
  [style.color]="hexColor()"
  [style.background-color]="hexColor() + '20'"
  [style.border-color]="hexColor()"
>
  {{ name() }}
  @if (removable()) {
    <button
      type="button"
      (click)="remove.emit()"
      [attr.aria-label]="'cardForm.tags.remove' | transloco"
      class="hover:opacity-70 transition-opacity"
    >
      <svg lucideX class="size-2.5" />
    </button>
  }
</span>
