<div [class]="containerClass()">
  <app-badge variant="accent-1" [size]="badgeSize()">
    {{ newCount() }}{{ newLabel() ? ' ' + newLabel() : '' }}
  </app-badge>
  <app-badge variant="accent-5" [size]="badgeSize()">
    {{ dueCount() }}{{ dueLabel() ? ' ' + dueLabel() : '' }}
  </app-badge>
  <app-badge variant="error" [size]="badgeSize()">
    {{ relearningCount() }}{{ relearningLabel() ? ' ' + relearningLabel() : '' }}
  </app-badge>
</div>
