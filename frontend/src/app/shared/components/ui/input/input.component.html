<div class="flex flex-col gap-1.5">
  @if (label()) {
    <label [for]="inputId" class="text-sm font-medium text-foreground">{{ label() }}</label>
  }

  <div class="relative">
    @if (iconLeft()) {
      <svg
        [lucideIcon]="iconLeft()!"
        class="absolute -translate-y-1/2 pointer-events-none left-3 top-1/2 size-4 text-subtle-foreground"
        aria-hidden="true"
      ></svg>
    }

    @if (multiline()) {
      <textarea
        [id]="inputId"
        [rows]="rows()"
        [placeholder]="placeholder()"
        [value]="value()"
        [disabled]="effectivelyDisabled()"
        [class]="inputClasses()"
        (input)="handleInput($event)"
        (blur)="handleBlur()"
      ></textarea>
    } @else {
      <input
        [id]="inputId"
        [type]="type()"
        [placeholder]="placeholder()"
        [value]="value()"
        [disabled]="effectivelyDisabled()"
        [class]="inputClasses()"
        (input)="handleInput($event)"
        (blur)="handleBlur()"
      />
    }
  </div>

  @if (error()) {
    <span class="text-xs text-error animate-fade-in">{{ error() }}</span>
  } @else if (hint()) {
    <span class="text-xs text-subtle-foreground">{{ hint() }}</span>
  }
</div>
